<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instiga</title>
    <link rel="stylesheet" href="../styles/index.css">
    <link rel="stylesheet" href="../styles/cadastro.css">
</head>

<body>
    <div id="bg-image">
    </div>

    <main>
        <div id="logos">

            <img src="../images/logo_nome.jpeg" alt="Instiga">
            <img src="../images/logo_imagem.jpeg" alt="Logo">

        </div>
        
        <form action="" id="form">
            <fieldset>
                <div class="form-area">
                    <label for="email">Email</label>
                    <input type="email" class="inputData" name="email" id="emailCadastro" autofocus onblur="emailValidate()">
                    <p class="dadoInvalido">Digite um endereço de email válido!</p>
                </div>

                <div class="form-area">
                    <label for="name">Nome Completo</label>
                    <input type="text" class="inputData" name="name" id="nomeCadastro" onblur="nameValidate()">
                    <p class="dadoInvalido">Digite seu nome completo!</p>
                </div>

                <div class="form-area">
                    <label for="password">Senha</label>
                    <input type="password" class="inputData" name="password" id="passwordCadastro" onblur="passwordValidate()">
                    <p class="dadoInvalido">Sua senha deve ter entre 8 e 14 caracteres alfanuméricos!</p>
                </div>

                <button id="cadastrar">Cadastrar-se</button>

                <span id="temConta">Já possui uma conta? <a href="../login/index.html">Entrar</a></span>

            </fieldset>
        </form>
                

    </main>
</body>
<script src="../scripts/cadastro.js"></script>
</html>
